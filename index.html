<title>Учёт часов — трекер времени</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #eef0ec;
    --surface: #ffffff;
    --surface-2: #e4e7e1;
    --ink: #1b1f1c;
    --muted: #5c6359;
    --faint: #8b9187;
    --line: #d3d7cd;
    --accent: #a8672a;
    --accent-ink: #ffffff;
    --accent-soft: #f0ddc0;
    --good: #4f7a4a;
    --bad: #b1503c;
    --shadow: 0 1px 2px rgba(30, 30, 20, 0.06), 0 8px 24px -12px rgba(30, 30, 20, 0.18);
    --heat-0: #e4e7e1;
    --heat-1: #f0ddc0;
    --heat-2: #dba85f;
    --heat-3: #c07f34;
    --heat-4: #8a5220;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141713;
      --surface: #1c201b;
      --surface-2: #23271f;
      --ink: #e9ebe4;
      --muted: #9aa093;
      --faint: #6b7165;
      --line: #31352c;
      --accent: #dd9c4f;
      --accent-ink: #1c1305;
      --accent-soft: #3a2c15;
      --good: #7fb677;
      --bad: #d97a63;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px -12px rgba(0, 0, 0, 0.55);
      --heat-0: #23271f;
      --heat-1: #3a2c15;
      --heat-2: #6b4a1e;
      --heat-3: #a2701f;
      --heat-4: #dd9c4f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141713;
    --surface: #1c201b;
    --surface-2: #23271f;
    --ink: #e9ebe4;
    --muted: #9aa093;
    --faint: #6b7165;
    --line: #31352c;
    --accent: #dd9c4f;
    --accent-ink: #1c1305;
    --accent-soft: #3a2c15;
    --good: #7fb677;
    --bad: #d97a63;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px -12px rgba(0, 0, 0, 0.55);
    --heat-0: #23271f;
    --heat-1: #3a2c15;
    --heat-2: #6b4a1e;
    --heat-3: #a2701f;
    --heat-4: #dd9c4f;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif; font-weight: 400; text-wrap: balance; margin: 0; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace; font-variant-numeric: tabular-nums; }
  button { font: inherit; }
  input, select { font: inherit; color: inherit; }
  ::selection { background: var(--accent-soft); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 24px 96px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* ---- Masthead ---- */
  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 18px;
  }
  .masthead .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .masthead h1 { font-size: 26px; letter-spacing: 0.2px; }
  .masthead .kicker {
    text-transform: uppercase;
    letter-spacing: 0.11em;
    font-size: 11px;
    color: var(--faint);
  }
  .clock {
    font-size: 13px;
    color: var(--muted);
    text-align: right;
  }
  .clock .date { display: block; }
  .clock .time { display: block; font-size: 16px; color: var(--ink); }

  /* ---- Timer card ---- */
  .timer-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .timer-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 20px;
    align-items: center;
  }
  .timer-fields {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .field-line {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  input[type="text"] {
    flex: 1 1 220px;
    min-width: 0;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 6px 2px;
    font-size: 18px;
    color: var(--ink);
  }
  input[type="text"]::placeholder { color: var(--faint); }
  input[type="text"]:focus { border-bottom-color: var(--accent); }

  .timer-display {
    font-size: 44px;
    text-align: right;
    min-width: 200px;
    letter-spacing: 0.5px;
  }
  .timer-display.idle { color: var(--faint); }
  .timer-display.running { color: var(--accent); }

  .timer-actions { display: flex; justify-content: flex-end; gap: 10px; }
  .btn {
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    border-radius: 7px;
    padding: 10px 20px;
    cursor: pointer;
    font-size: 14px;
    transition: filter 0.12s ease;
  }
  .btn:hover { filter: brightness(0.96); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .btn:hover { filter: brightness(1.15); }
  }
  :root[data-theme="dark"] .btn:hover { filter: brightness(1.15); }
  .btn-start {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }
  .btn-pause {
    background: var(--surface-2);
    border-color: var(--line);
    color: var(--ink);
    font-weight: 600;
  }
  .btn-stop {
    background: var(--bad);
    border-color: var(--bad);
    color: #fff;
    font-weight: 600;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .timer-display.paused { color: var(--muted); }

  /* ---- Section headers ---- */
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
  }
  .section-head h2 { font-size: 18px; }
  .section-head .meta { font-size: 12px; color: var(--muted); }

  /* ---- Ledger (today's entries) ---- */
  .ledger { display: flex; flex-direction: column; }
  .entry {
    display: grid;
    grid-template-columns: 10px 1fr auto auto auto;
    align-items: center;
    gap: 14px;
    padding: 12px 4px;
    border-bottom: 1px solid var(--line);
  }
  .entry:last-child { border-bottom: none; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .entry .task { font-size: 15px; }
  .entry .range { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .entry .dur { font-size: 15px; white-space: nowrap; }
  .entry .del {
    background: none;
    border: none;
    color: var(--faint);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 4px;
  }
  .entry .del:hover { color: var(--bad); }
  .entry .del.confirm {
    color: var(--bad);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .empty {
    color: var(--faint);
    font-size: 14px;
    padding: 22px 4px;
    text-align: center;
  }

  /* ---- Summary ---- */
  .summary { display: flex; flex-direction: column; gap: 10px; }
  .summary-row {
    display: grid;
    grid-template-columns: 130px 1fr 64px;
    align-items: center;
    gap: 12px;
  }
  .summary-row .label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .bar-track {
    height: 8px;
    background: var(--surface-2);
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 4px; }
  .summary-row .val { font-size: 13px; text-align: right; color: var(--ink); }
  .summary-total {
    display: flex;
    justify-content: space-between;
    padding-top: 10px;
    margin-top: 4px;
    border-top: 1px solid var(--line);
    font-size: 15px;
  }
  .summary-total .n { font-size: 18px; }

  footer.hint {
    text-align: center;
    color: var(--faint);
    font-size: 12px;
    padding-top: 8px;
  }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--line);
  }
  .tab-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    padding: 10px 4px;
    margin-bottom: -1px;
    font-size: 14px;
    cursor: pointer;
  }
  .tab-btn + .tab-btn { margin-left: 18px; }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .tab-panel { display: flex; flex-direction: column; gap: 28px; }

  /* ---- Calendar ---- */
  .cal-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .year-nav { display: flex; align-items: center; gap: 12px; }
  .year-nav .btn { padding: 6px 12px; font-size: 14px; }
  .year-label { font-size: 18px; min-width: 4.5em; text-align: center; }

  .cal-legend {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--faint);
  }
  .cal-legend .dot { width: 10px; height: 10px; border-radius: 2px; margin: 0 1px; }
  .cal-legend .dot.heat-0 { background: var(--heat-0); }
  .cal-legend .dot.heat-1 { background: var(--heat-1); }
  .cal-legend .dot.heat-2 { background: var(--heat-2); }
  .cal-legend .dot.heat-3 { background: var(--heat-3); }
  .cal-legend .dot.heat-4 { background: var(--heat-4); }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .month-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 14px 14px 16px;
  }
  .month-card h3 {
    font-size: 14px;
    margin-bottom: 10px;
    text-transform: capitalize;
  }
  .month-weekdays, .month-days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  .month-weekdays {
    margin-bottom: 4px;
  }
  .month-weekdays span {
    font-size: 9px;
    text-transform: uppercase;
    color: var(--faint);
    text-align: center;
  }
  .day-cell {
    aspect-ratio: 1;
    border: none;
    border-radius: 3px;
    background: var(--heat-0);
    color: var(--muted);
    font-size: 10px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .day-cell.blank { visibility: hidden; cursor: default; }
  .day-cell.heat-1 { background: var(--heat-1); color: var(--ink); }
  .day-cell.heat-2 { background: var(--heat-2); color: var(--ink); }
  .day-cell.heat-3 { background: var(--heat-3); color: #fff; }
  .day-cell.heat-4 { background: var(--heat-4); color: #fff; }
  .day-cell.future { opacity: 0.45; cursor: default; }
  .day-cell.is-today { box-shadow: inset 0 0 0 2px var(--accent); }
  .day-cell.selected { box-shadow: inset 0 0 0 2px var(--ink); }
  .day-cell:not(.blank):not(.future):hover { filter: brightness(0.94); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .day-cell:not(.blank):not(.future):hover { filter: brightness(1.25); }
  }
  :root[data-theme="dark"] .day-cell:not(.blank):not(.future):hover { filter: brightness(1.25); }

  .day-detail { display: flex; flex-direction: column; gap: 12px; }

  @media (max-width: 560px) {
    .timer-row { grid-template-columns: 1fr; }
    .timer-display { text-align: left; font-size: 38px; }
    .timer-actions { justify-content: flex-start; }
    .entry { grid-template-columns: 8px 1fr auto; row-gap: 4px; }
    .entry .range { grid-column: 2 / 3; }
    .entry .del { justify-self: end; }
    .cal-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  }
</style>

<div class="wrap">
  <header class="masthead">
    <div class="brand">
      <div>
        <span class="kicker">учёт часов</span>
        <h1>Трекер времени</h1>
      </div>
    </div>
    <div class="clock">
      <span class="date" id="todayDate"></span>
      <span class="time mono" id="liveClock"></span>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab-btn active" id="tabBtnTracker" role="tab" aria-selected="true" data-tab="tracker">Трекер</button>
    <button class="tab-btn" id="tabBtnCalendar" role="tab" aria-selected="false" data-tab="calendar">Календарь</button>
  </nav>

  <div id="panelTracker" class="tab-panel">
    <section class="timer-card">
      <div class="timer-row">
        <div class="timer-fields">
          <div class="field-line">
            <input type="text" id="taskInput" placeholder="Чем занимаетесь?" autocomplete="off" />
          </div>
        </div>
        <div class="timer-display idle mono" id="timerDisplay">00:00:00</div>
      </div>
      <div class="timer-actions">
        <button class="btn btn-start" id="startBtn">Старт</button>
        <button class="btn btn-pause" id="pauseBtn" disabled>Пауза</button>
        <button class="btn btn-stop" id="stopBtn" disabled>Стоп</button>
      </div>
    </section>

    <section>
      <div class="section-head">
        <h2>Сегодня</h2>
        <span class="meta mono" id="todayTotal">0ч 00м</span>
      </div>
      <div class="ledger" id="todayLedger"></div>
    </section>

    <section>
      <div class="section-head">
        <h2>Итоги · 7 дней</h2>
        <span class="meta mono" id="weekTotal">0ч 00м</span>
      </div>
      <div class="summary" id="weekSummary"></div>
    </section>
  </div>

  <div id="panelCalendar" class="tab-panel" hidden>
    <section class="cal-toolbar">
      <div class="section-head" style="border-bottom:none; padding-bottom:0;">
        <h2>Годовой календарь</h2>
      </div>
      <div class="year-nav">
        <button class="btn" id="prevYearBtn" aria-label="Предыдущий год">←</button>
        <span class="year-label mono" id="yearLabel">2026</span>
        <button class="btn" id="nextYearBtn" aria-label="Следующий год">→</button>
      </div>
    </section>

    <div class="cal-legend">
      <span>Меньше</span>
      <span class="dot heat-0"></span>
      <span class="dot heat-1"></span>
      <span class="dot heat-2"></span>
      <span class="dot heat-3"></span>
      <span class="dot heat-4"></span>
      <span>Больше</span>
    </div>

    <div class="cal-grid" id="calGrid"></div>

    <section class="day-detail">
      <div class="section-head">
        <h2 id="dayDetailTitle">Выберите день в календаре</h2>
        <span class="meta mono" id="dayDetailTotal"></span>
      </div>
      <div class="ledger" id="dayDetailLedger"></div>
    </section>
  </div>

  <footer class="hint">Данные хранятся локально в этом браузере.</footer>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "tt_entries_v1";
  var STATE_KEY = "tt_running_v1";

  // A small fixed palette; a task's color is derived deterministically from its name
  // so the same task always gets the same dot color across sessions.
  var PALETTE = ["#a8672a", "#4f7a4a", "#6a7fb5", "#b1503c", "#8a6aa8", "#5c8a8f"];

  function colorForTask(name) {
    var str = name || "Без названия";
    var hash = 0;
    for (var i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
    return PALETTE[hash % PALETTE.length];
  }

  function load(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

  var entries = load(STORAGE_KEY, []);
  // running: { task, firstStartedAt, segmentStartedAt, accumulated, paused }
  // segmentStartedAt is null while paused; accumulated holds ms from finished segments.
  var running = load(STATE_KEY, null);

  var els = {
    taskInput: document.getElementById("taskInput"),
    startBtn: document.getElementById("startBtn"),
    pauseBtn: document.getElementById("pauseBtn"),
    stopBtn: document.getElementById("stopBtn"),
    timerDisplay: document.getElementById("timerDisplay"),
    todayLedger: document.getElementById("todayLedger"),
    todayTotal: document.getElementById("todayTotal"),
    weekSummary: document.getElementById("weekSummary"),
    weekTotal: document.getElementById("weekTotal"),
    liveClock: document.getElementById("liveClock"),
    todayDate: document.getElementById("todayDate"),
    tabBtnTracker: document.getElementById("tabBtnTracker"),
    tabBtnCalendar: document.getElementById("tabBtnCalendar"),
    panelTracker: document.getElementById("panelTracker"),
    panelCalendar: document.getElementById("panelCalendar"),
    prevYearBtn: document.getElementById("prevYearBtn"),
    nextYearBtn: document.getElementById("nextYearBtn"),
    yearLabel: document.getElementById("yearLabel"),
    calGrid: document.getElementById("calGrid"),
    dayDetailTitle: document.getElementById("dayDetailTitle"),
    dayDetailTotal: document.getElementById("dayDetailTotal"),
    dayDetailLedger: document.getElementById("dayDetailLedger")
  };

  function fmtDuration(ms) {
    var totalSec = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(totalSec / 3600);
    var m = Math.floor((totalSec % 3600) / 60);
    var s = totalSec % 60;
    function pad(n) { return String(n).padStart(2, "0"); }
    return pad(h) + ":" + pad(m) + ":" + pad(s);
  }

  function fmtHoursShort(ms) {
    var totalMin = Math.round(ms / 60000);
    var h = Math.floor(totalMin / 60);
    var m = totalMin % 60;
    return h + "ч " + String(m).padStart(2, "0") + "м";
  }

  function fmtTimeOfDay(ts) {
    var d = new Date(ts);
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  function startOfDay(ts) {
    var d = new Date(ts);
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }

  // Older entries have no explicit duration (they predate pause support) —
  // fall back to end - start for those.
  function entryDuration(e) {
    return typeof e.duration === "number" ? e.duration : (e.end - e.start);
  }

  function renderTodayLedger() {
    resetPendingDelete();
    var todayStart = startOfDay(Date.now());
    var todays = entries.filter(function (e) { return e.start >= todayStart; })
      .sort(function (a, b) { return b.start - a.start; });

    els.todayLedger.innerHTML = "";
    if (todays.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Пока нет записей за сегодня — запустите таймер выше.";
      els.todayLedger.appendChild(empty);
    } else {
      todays.forEach(function (e) {
        var row = document.createElement("div");
        row.className = "entry";
        row.innerHTML =
          '<span class="dot" style="background:' + colorForTask(e.task) + '"></span>' +
          '<span class="task">' + escapeHtml(e.task || "Без названия") + '</span>' +
          '<span class="range mono">' + fmtTimeOfDay(e.start) + '–' + fmtTimeOfDay(e.end) + '</span>' +
          '<span class="dur mono">' + fmtHoursShort(entryDuration(e)) + '</span>' +
          '<button class="del" title="Удалить" data-id="' + e.id + '">✕</button>';
        els.todayLedger.appendChild(row);
      });
    }

    var totalMs = todays.reduce(function (sum, e) { return sum + entryDuration(e); }, 0);
    els.todayTotal.textContent = fmtHoursShort(totalMs);
  }

  function renderWeekSummary() {
    var weekStart = Date.now() - 7 * 24 * 3600 * 1000;
    var byTask = {};
    var total = 0;
    entries.filter(function (e) { return e.start >= weekStart; }).forEach(function (e) {
      var name = e.task || "Без названия";
      var dur = entryDuration(e);
      byTask[name] = (byTask[name] || 0) + dur;
      total += dur;
    });

    els.weekSummary.innerHTML = "";
    var rows = Object.keys(byTask)
      .map(function (name) { return { name: name, dur: byTask[name] }; })
      .sort(function (a, b) { return b.dur - a.dur; });

    if (rows.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Записей за неделю пока нет.";
      els.weekSummary.appendChild(empty);
    } else {
      var max = rows[0].dur;
      rows.forEach(function (r) {
        var color = colorForTask(r.name);
        var row = document.createElement("div");
        row.className = "summary-row";
        var pct = max > 0 ? Math.round((r.dur / max) * 100) : 0;
        row.innerHTML =
          '<span class="label"><span class="dot" style="background:' + color + '"></span>' + escapeHtml(r.name) + '</span>' +
          '<span class="bar-track"><span class="bar-fill" style="width:' + pct + '%; background:' + color + '"></span></span>' +
          '<span class="val mono">' + fmtHoursShort(r.dur) + '</span>';
        els.weekSummary.appendChild(row);
      });
    }
    els.weekTotal.textContent = fmtHoursShort(total);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ============================ Year calendar ============================ */

  var MONTH_NAMES = ["январь", "февраль", "март", "апрель", "май", "июнь",
    "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];
  var WEEKDAY_LABELS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];

  var calendarYear = new Date().getFullYear();
  var selectedDateKey = null;

  function pad2(n) { return String(n).padStart(2, "0"); }

  function dateKeyOf(ts) {
    var d = new Date(ts);
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  function heatLevel(ms) {
    var hours = ms / 3600000;
    if (hours <= 0) return 0;
    if (hours < 1) return 1;
    if (hours < 3) return 2;
    if (hours < 6) return 3;
    return 4;
  }

  // Groups every entry by local calendar day: { "2026-08-08": { totalMs, entries: [...] } }
  function buildDayTotals() {
    var byDay = {};
    entries.forEach(function (e) {
      var key = dateKeyOf(e.start);
      if (!byDay[key]) byDay[key] = { totalMs: 0, entries: [] };
      byDay[key].totalMs += entryDuration(e);
      byDay[key].entries.push(e);
    });
    return byDay;
  }

  function renderCalendar() {
    els.yearLabel.textContent = calendarYear;
    var byDay = buildDayTotals();
    var todayKey = dateKeyOf(Date.now());

    els.calGrid.innerHTML = "";
    for (var month = 0; month < 12; month++) {
      var firstWeekday = (new Date(calendarYear, month, 1).getDay() + 6) % 7; // Monday = 0
      var daysInMonth = new Date(calendarYear, month + 1, 0).getDate();

      var card = document.createElement("div");
      card.className = "month-card";

      var heading = document.createElement("h3");
      heading.textContent = MONTH_NAMES[month];
      card.appendChild(heading);

      var weekdaysRow = document.createElement("div");
      weekdaysRow.className = "month-weekdays";
      WEEKDAY_LABELS.forEach(function (w) {
        var s = document.createElement("span");
        s.textContent = w;
        weekdaysRow.appendChild(s);
      });
      card.appendChild(weekdaysRow);

      var daysGrid = document.createElement("div");
      daysGrid.className = "month-days";

      for (var i = 0; i < firstWeekday; i++) {
        var blank = document.createElement("span");
        blank.className = "day-cell blank";
        daysGrid.appendChild(blank);
      }

      for (var day = 1; day <= daysInMonth; day++) {
        var key = calendarYear + "-" + pad2(month + 1) + "-" + pad2(day);
        var info = byDay[key];
        var level = info ? heatLevel(info.totalMs) : 0;
        var isFuture = key > todayKey;

        var cell = document.createElement("button");
        cell.type = "button";
        cell.className = "day-cell heat-" + level;
        if (isFuture) cell.className += " future";
        if (key === todayKey) cell.className += " is-today";
        if (key === selectedDateKey) cell.className += " selected";
        cell.textContent = day;
        cell.setAttribute("data-date", key);
        if (info) cell.title = fmtHoursShort(info.totalMs);
        daysGrid.appendChild(cell);
      }

      card.appendChild(daysGrid);
      els.calGrid.appendChild(card);
    }
  }

  function formatDayTitle(key) {
    var parts = key.split("-").map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    return d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric", weekday: "long" });
  }

  function renderDayDetail(key) {
    selectedDateKey = key;
    var byDay = buildDayTotals();
    var info = byDay[key] || { totalMs: 0, entries: [] };

    els.dayDetailTitle.textContent = formatDayTitle(key);
    els.dayDetailTotal.textContent = fmtHoursShort(info.totalMs);

    var sorted = info.entries.slice().sort(function (a, b) { return b.start - a.start; });
    els.dayDetailLedger.innerHTML = "";
    if (sorted.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Нет записей за этот день.";
      els.dayDetailLedger.appendChild(empty);
      return;
    }
    sorted.forEach(function (e) {
      var row = document.createElement("div");
      row.className = "entry";
      row.innerHTML =
        '<span class="dot" style="background:' + colorForTask(e.task) + '"></span>' +
        '<span class="task">' + escapeHtml(e.task || "Без названия") + '</span>' +
        '<span class="range mono">' + fmtTimeOfDay(e.start) + '–' + fmtTimeOfDay(e.end) + '</span>' +
        '<span class="dur mono">' + fmtHoursShort(entryDuration(e)) + '</span>' +
        '<button class="del" title="Удалить" data-id="' + e.id + '">✕</button>';
      els.dayDetailLedger.appendChild(row);
    });

    // Refresh the calendar's selection outline without a full rebuild.
    els.calGrid.querySelectorAll(".day-cell.selected").forEach(function (el) { el.classList.remove("selected"); });
    var cell = els.calGrid.querySelector('.day-cell[data-date="' + key + '"]');
    if (cell) cell.classList.add("selected");
  }

  els.calGrid.addEventListener("click", function (ev) {
    var cell = ev.target.closest(".day-cell");
    if (!cell || cell.classList.contains("blank")) return;
    renderDayDetail(cell.getAttribute("data-date"));
  });

  els.prevYearBtn.addEventListener("click", function () {
    calendarYear -= 1;
    renderCalendar();
  });
  els.nextYearBtn.addEventListener("click", function () {
    calendarYear += 1;
    renderCalendar();
  });

  function switchTab(tab) {
    var showCalendar = tab === "calendar";
    els.panelTracker.hidden = showCalendar;
    els.panelCalendar.hidden = !showCalendar;
    els.tabBtnTracker.classList.toggle("active", !showCalendar);
    els.tabBtnCalendar.classList.toggle("active", showCalendar);
    els.tabBtnTracker.setAttribute("aria-selected", String(!showCalendar));
    els.tabBtnCalendar.setAttribute("aria-selected", String(showCalendar));
    if (showCalendar && !els.calGrid.childElementCount) renderCalendar();
  }

  els.tabBtnTracker.addEventListener("click", function () { switchTab("tracker"); });
  els.tabBtnCalendar.addEventListener("click", function () { switchTab("calendar"); });

  var tickHandle = null;

  function elapsedMs() {
    if (!running) return 0;
    return running.accumulated + (running.paused ? 0 : Date.now() - running.segmentStartedAt);
  }

  function renderTimer() {
    if (running && !running.paused) {
      els.timerDisplay.className = "timer-display running mono";
      els.timerDisplay.textContent = fmtDuration(elapsedMs());
      els.startBtn.disabled = true;
      els.pauseBtn.disabled = false;
      els.pauseBtn.textContent = "Пауза";
      els.stopBtn.disabled = false;
      els.taskInput.disabled = true;
    } else if (running && running.paused) {
      els.timerDisplay.className = "timer-display paused mono";
      els.timerDisplay.textContent = fmtDuration(elapsedMs());
      els.startBtn.disabled = true;
      els.pauseBtn.disabled = false;
      els.pauseBtn.textContent = "Продолжить";
      els.stopBtn.disabled = false;
      els.taskInput.disabled = true;
    } else {
      els.timerDisplay.className = "timer-display idle mono";
      els.timerDisplay.textContent = "00:00:00";
      els.startBtn.disabled = false;
      els.pauseBtn.disabled = true;
      els.pauseBtn.textContent = "Пауза";
      els.stopBtn.disabled = true;
      els.taskInput.disabled = false;
    }
  }

  function tick() {
    if (running && !running.paused) els.timerDisplay.textContent = fmtDuration(elapsedMs());
  }

  function updateClock() {
    var now = new Date();
    els.liveClock.textContent = String(now.getHours()).padStart(2, "0") + ":" +
      String(now.getMinutes()).padStart(2, "0") + ":" + String(now.getSeconds()).padStart(2, "0");
    els.todayDate.textContent = now.toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" });
  }

  els.startBtn.addEventListener("click", function () {
    running = {
      task: els.taskInput.value.trim(),
      firstStartedAt: Date.now(),
      segmentStartedAt: Date.now(),
      accumulated: 0,
      paused: false
    };
    save(STATE_KEY, running);
    renderTimer();
  });

  els.pauseBtn.addEventListener("click", function () {
    if (!running) return;
    if (running.paused) {
      running.segmentStartedAt = Date.now();
      running.paused = false;
    } else {
      running.accumulated += Date.now() - running.segmentStartedAt;
      running.segmentStartedAt = null;
      running.paused = true;
    }
    save(STATE_KEY, running);
    renderTimer();
  });

  els.stopBtn.addEventListener("click", function () {
    if (!running) return;
    var entry = {
      id: String(Date.now()) + Math.random().toString(16).slice(2),
      task: running.task,
      start: running.firstStartedAt,
      end: Date.now(),
      duration: elapsedMs()
    };
    entries.push(entry);
    save(STORAGE_KEY, entries);
    running = null;
    localStorage.removeItem(STATE_KEY);
    els.taskInput.value = "";
    renderTimer();
    afterEntriesChanged();
  });

  var pendingDeleteId = null;
  var pendingDeleteTimer = null;

  function resetPendingDelete() {
    pendingDeleteId = null;
    if (pendingDeleteTimer) { clearTimeout(pendingDeleteTimer); pendingDeleteTimer = null; }
  }

  // Deleting an entry can affect the today ledger, the week summary and the
  // year calendar (heat + open day detail) all at once — refresh whichever
  // of those exist right now.
  function afterEntriesChanged() {
    renderTodayLedger();
    renderWeekSummary();
    if (els.calGrid.childElementCount) renderCalendar();
    if (selectedDateKey) renderDayDetail(selectedDateKey);
  }

  function handleLedgerDeleteClick(ev, onArmedReset) {
    var btn = ev.target.closest(".del");
    if (!btn) return;
    var id = btn.getAttribute("data-id");

    if (pendingDeleteId !== id) {
      // First click: arm the confirmation instead of deleting right away.
      resetPendingDelete();
      pendingDeleteId = id;
      btn.classList.add("confirm");
      btn.textContent = "Точно?";
      btn.title = "Нажмите ещё раз, чтобы удалить";
      pendingDeleteTimer = setTimeout(function () {
        resetPendingDelete();
        onArmedReset();
      }, 3000);
      return;
    }

    // Second click on the same row within the window: actually delete.
    resetPendingDelete();
    entries = entries.filter(function (e) { return e.id !== id; });
    save(STORAGE_KEY, entries);
    afterEntriesChanged();
  }

  els.todayLedger.addEventListener("click", function (ev) {
    handleLedgerDeleteClick(ev, renderTodayLedger);
  });

  els.dayDetailLedger.addEventListener("click", function (ev) {
    handleLedgerDeleteClick(ev, function () { renderDayDetail(selectedDateKey); });
  });

  els.taskInput.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && !els.startBtn.disabled) els.startBtn.click();
  });

  // init
  if (running) {
    els.taskInput.value = running.task || "";
  }
  renderTimer();
  renderTodayLedger();
  renderWeekSummary();
  updateClock();
  setInterval(updateClock, 1000);
  tickHandle = setInterval(tick, 1000);
})();
</script>
